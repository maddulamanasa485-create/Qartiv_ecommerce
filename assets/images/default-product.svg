<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fc" />
      <stop offset="50%" stop-color="#eef1f8" />
      <stop offset="100%" stop-color="#e3e8f4" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6258ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Decorative Circles -->
  <circle cx="200" cy="180" r="130" fill="#ffffff" fill-opacity="0.6" />
  <circle cx="200" cy="180" r="95" fill="#f1f3fa" fill-opacity="0.8" />

  <!-- Product Box Icon Graphic -->
  <g filter="url(#softShadow)" transform="translate(140, 110)">
    <!-- Main Box Container -->
    <rect x="0" y="20" width="120" height="110" rx="20" fill="url(#primaryGrad)" />
    
    <!-- Box Lid / Top Flap -->
    <path d="M 12 20 L 60 5 L 108 20 Z" fill="#7a70ff" />
    
    <!-- Accent Ribbon / Ribbon Cross -->
    <path d="M 52 20 L 68 20 L 68 130 L 52 130 Z" fill="#ffffff" fill-opacity="0.22" />
    
    <!-- Center Emblem / QARTIV Mark -->
    <circle cx="60" cy="75" r="22" fill="#ffffff" fill-opacity="0.95" />
    <text x="60" y="83" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#6258ff" text-anchor="middle">Q</text>
  </g>

  <!-- Sparkle Accents -->
  <path d="M 110 110 Q 110 125 95 125 Q 110 125 110 140 Q 110 125 125 125 Q 110 125 110 110" fill="#8b5cf6" fill-opacity="0.75" />
  <path d="M 290 100 Q 290 112 278 112 Q 290 112 290 124 Q 290 112 302 112 Q 290 112 290 100" fill="#6258ff" fill-opacity="0.6" />
  <circle cx="295" cy="220" r="4" fill="#a78bfa" />
  <circle cx="105" cy="210" r="3" fill="#818cf8" />

  <!-- Typography Label -->
  <g transform="translate(200, 290)">
    <!-- Pill Badge -->
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#ffffff" stroke="#e0e4f0" stroke-width="1" />
    <text x="0" y="4" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#6366f1" letter-spacing="1.5" text-anchor="middle">QARTIV PRODUCT</text>
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8c93a8" text-anchor="middle">No Image Available</text>
  </g>
</svg>
